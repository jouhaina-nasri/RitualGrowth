server.port=8084
server.servlet.context-path=/events

#datasource postgres
spring.datasource.platform=postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/events
spring.datasource.username=root
spring.datasource.password=123

# jpa hibernate properties
spring.jpa.database=default
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.show-sql=true
spring.jpa.hibernate.database= postgresql
spring.jpa.hibernate.database-platform= org.hibernate.dialect.PostgreSQLDialect

#Method org.postgresql.jdbc.PgConnection.createClob() implemented.
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true


#datasource influxdb

spring.influx.url=http://localhost:8086
spring.influx.user=admin
spring.influx.password=admin
spring.influx.database=events


## TODO remove remote properties from development
com.hippo.notifictions.per.receiver.limit=30

#logging.level.org.hibernate.type=trace
logging.level.org.hibernate.stat=debug

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
# ===============================

server.tomcat.max-swallow-size=-1
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1300KB


springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/docs
#springdoc.swagger-ui.filter=true
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
#server.forward-headers-strategy=FRAMEWORK
com.hippo.docs.openapi.server.url=
#http://pc:8085

com.hippo.firebase.config.file=${FIREBASE_CONFIG_FILE:./secrets/firebase-adminsdk.json}
com.hippo.firebase.database.url=https://hippo-app-85274-default-rtdb.firebaseio.com

com.hippo.security.firebase-props.enable-strict-server-session=true
com.hippo.security.firebase-props.enable-check-session-revoked=false
com.hippo.security.firebase-props.enable-logout-everywhere=false
com.hippo.security.firebase-props.session-expiry-in-days=5

com.hippo.security.cookie-props.max-age-in-minutes=7200
com.hippo.security.cookie-props.http-only=true
com.hippo.security.cookie-props.secure=false
com.hippo.security.cookie-props.domain=localhost
com.hippo.security.cookie-props.path=/

com.hippo.security.allow-credentials=true
com.hippo.security.allowed-origins=http://localhost:8084
com.hippo.security.allowed-methods=GET,POST,DELETE,OPTIONS
com.hippo.security.allowed-headers=hippo-api-version,hippo-auth-status,Authorization,Origin,Content-Type,Accept,Accept-Encoding,Accept-Language,Content-Length,\
									Access-Control-Allow-Origin,Access-Control-Allow-Headers,Access-Control-Request-Method,Access-Control-Max-Age,\
									Access-Control-Allow-Credentials,X-Requested-With,X-Auth-Token,X-Xsrf-Token,Cache-Control,Id-Token
com.hippo.security.allowed-public-apis=/h2-console/**,/docs/**,/swagger-ui/**,/v3/api-docs/**,/_test,/images/**
com.hippo.security.exposed-headers=X-Xsrf-Token,hippo-api-version,hippo-auth-status

#one minuta fixed delay for all managers
com.hippo.batch.tasks.fixeddelay.default=60000
com.hippo.batch.tasks.initdelay.default=60000

com.hippo.batch.tasks.initdelay.events.manager=30000
com.hippo.batch.tasks.initdelay.csevents.manager=45000
com.hippo.batch.tasks.initdelay.topics.manager=60000

spring.mail.host=secure.emailsrvr.com
spring.mail.port=587
spring.mail.username=noreply@joinhippo.com
#spring.mail.password=[provided]
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

com.hippo.email.sender.server.url=http://localhost:8084/
com.hippo.email.test.receiver.enabled=true

com.hippo.test.auth.token.enabled=true



#Redis
spring.cache.type=redis
spring.cache.redis.time-to-live=60000
spring.cache.redis.cache-null-values= true
spring.redis.host= 127.0.0.1
spring.redis.port= 6379
spring.redis.username=
spring.redis.password=

#Persistence data in Redis:
############
#Used to configure eviction policy that persist data to disk.
spring.redis.cache.eviction-policy=LRU
#Used to enable AOF persistence
spring.redis.aof=true


spring.data.redis.repositories.enabled = false

spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
