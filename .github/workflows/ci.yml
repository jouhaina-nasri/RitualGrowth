name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Build and run unit tests
        run: mvn -B verify 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Report build errors
        if: failure()
        run: |
          grep -E '^\[ERROR\]|Tests run:.*Fail' build.log | grep -v 'Help 1\|-> \[Help\|^\[ERROR\] *$' | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

  integration-tests:
    name: Integration tests (PostgreSQL, Redis, InfluxDB)
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: events
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
      influxdb:
        image: influxdb:1.8
        env:
          INFLUXDB_DB: events
          INFLUXDB_ADMIN_USER: admin
          INFLUXDB_ADMIN_PASSWORD: admin
          INFLUXDB_HTTP_AUTH_ENABLED: 'true'
        ports: ['8086:8086']
    env:
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      FIREBASE_CONFIG_FILE: ${{ github.workspace }}/ci-firebase.json
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Create a throwaway Firebase service-account key
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out ci-key.pem
          python3 -c "import json; print(json.dumps({'type':'service_account','project_id':'ci-test','private_key_id':'ci','private_key':open('ci-key.pem').read(),'client_email':'ci@ci-test.iam.gserviceaccount.com','client_id':'1','token_uri':'https://oauth2.googleapis.com/token'}))" > ci-firebase.json
      - name: Run integration tests
        run: mvn -B verify -Pintegration-tests -pl events-influxdb -am 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Report test failures
        if: failure()
        run: |
          grep -E '^\[ERROR\]|Tests run:.*Fail|Caused by' build.log | grep -v 'Help 1\|-> \[Help\|^\[ERROR\] *$' | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
