name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Build and run unit tests
        run: mvn -B verify 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Report build errors
        if: failure()
        run: |
          grep -E '^\[ERROR\]|Tests run:.*Fail' build.log | grep -v 'Help 1\|-> \[Help\|^\[ERROR\] *$' | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
